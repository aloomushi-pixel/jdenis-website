server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_comp_level 6;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Never cache PWA service worker, version check, sitemaps, feeds, or robots
    location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest|__version\.json|sitemap\.xml|sitemap-productos\.xml|google-merchant-feed\.xml|robots\.txt|llms\.txt)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # Cache content-hashed Vite bundles immutable for 1 year
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache static media & fonts (non-JS)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA & Pre-rendered SEO routing - serve route-specific index.html directly (200 OK, always revalidate HTML)
    absolute_redirect off;
    port_in_redirect off;
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
